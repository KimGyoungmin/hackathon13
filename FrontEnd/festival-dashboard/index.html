<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>전라남도 축제 데이터 분석</title>
    <!-- 카카오맵 API 스크립트 -->
    <script src="config.js"></script>
    <script>
        // CONFIG 객체가 로드될 때까지 기다림
        function waitForConfig() {
            if (typeof CONFIG === 'undefined' || !CONFIG.KAKAO_MAP_KEY) {
                console.log('CONFIG 객체 로딩 대기 중...');
                setTimeout(waitForConfig, 100);
                return;
            }
            
            console.log('카카오맵 API 키:', CONFIG.KAKAO_MAP_KEY);

            // 카카오맵 SDK 로드
            const script = document.createElement('script');
            script.type = 'text/javascript';
            script.src = '//dapi.kakao.com/v2/maps/sdk.js?appkey=' + CONFIG.KAKAO_MAP_KEY + '&autoload=false';
            script.onload = function() {
                console.log('카카오맵 SDK 스크립트 로드 완료');
                // 카카오맵 API 초기화
                window.kakao.maps.load(function() {
                    console.log('카카오맵 API 초기화 완료');
                    window.kakaoMapLoaded = true;
                    // 지도 로딩 완료 이벤트 발생
                    window.dispatchEvent(new CustomEvent('kakaoMapReady'));
                });
            };
            script.onerror = function() {
                console.error('카카오맵 SDK 로드 실패 - API 키를 확인해주세요:', CONFIG.KAKAO_MAP_KEY);
            };
            document.head.appendChild(script);
        }
        
        // CONFIG 로딩 대기 시작
        waitForConfig();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
